<div class="flex h-dvh w-full overflow-hidden
            bg-slate-100 text-slate-900
            transition-colors duration-300
            dark:bg-slate-950 dark:text-white">

  <!-- Fond sombre derrière la sidebar sur mobile -->
  @if (sidebarOuverte) {
    <button
      type="button"
      aria-label="Fermer le menu"
      class="fixed inset-0 z-40 bg-black/50 lg:hidden"
      (click)="fermerSidebar()">
    </button>
  }

  <!-- SIDEBAR -->
  <aside
    class="fixed inset-y-0 left-0 z-50
           flex w-72 max-w-[85vw] shrink-0 flex-col
           border-r border-slate-200 bg-white
           transition-transform duration-300
           dark:border-slate-800 dark:bg-slate-900
           lg:static lg:max-w-none lg:translate-x-0"
    [class.-translate-x-full]="!sidebarOuverte"
    [class.lg:-translate-x-full]="!sidebarOuverte">

    <!-- LOGO -->
    <div class="flex h-20 shrink-0 items-center gap-3
                border-b border-slate-200 px-5
                dark:border-slate-800">

      <div class="flex h-11 w-11 shrink-0 items-center
                  justify-center rounded-2xl bg-violet-600
                  text-xl text-white shadow-lg">
        💍
      </div>

      <div class="min-w-0">
        <h1 class="truncate font-bold text-slate-900 dark:text-white">
          Wedding Manager
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">
          Administration
        </p>
      </div>

      <!-- Fermer sur mobile -->
      <button
        type="button"
        class="ml-auto rounded-lg p-2 text-slate-500
               hover:bg-slate-100 lg:hidden
               dark:hover:bg-slate-800"
        aria-label="Fermer le menu"
        (click)="fermerSidebar()">
        ✕
      </button>
    </div>

    <!-- MENU -->
    <nav class="flex-1 space-y-2 overflow-y-auto overflow-x-hidden p-4">

      <p class="mb-3 px-3 text-xs font-semibold uppercase
                tracking-wider text-slate-400">
        Administration
      </p>

      <a
        routerLink="/admin/dashboard"
        routerLinkActive="bg-violet-100 text-violet-700 dark:bg-violet-500/10 dark:text-violet-400"
        (click)="fermerSidebarMobile()"
        class="flex min-w-0 items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-slate-600 transition
               hover:bg-slate-100 dark:text-slate-300
               dark:hover:bg-slate-800">
        <span class="shrink-0 text-lg">🏠</span>
        <span>Dashboard</span>
      </a>

      <a
        routerLink="/admin/utilisateurs"
        routerLinkActive="bg-violet-100 text-violet-700 dark:bg-violet-500/10 dark:text-violet-400"
        (click)="fermerSidebarMobile()"
        class="flex min-w-0 items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-slate-600 transition
               hover:bg-slate-100 dark:text-slate-300
               dark:hover:bg-slate-800">
        <span class="shrink-0 text-lg">👥</span>
        <span>Utilisateurs</span>
      </a>

      <a
        routerLink="/admin/mariages"
        routerLinkActive="bg-violet-100 text-violet-700 dark:bg-violet-500/10 dark:text-violet-400"
        (click)="fermerSidebarMobile()"
        class="flex min-w-0 items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-slate-600 transition
               hover:bg-slate-100 dark:text-slate-300
               dark:hover:bg-slate-800">
        <span class="shrink-0 text-lg">💍</span>
        <span>Mariages</span>
      </a>

      <a
        routerLink="/admin/statistiques"
        routerLinkActive="bg-violet-100 text-violet-700 dark:bg-violet-500/10 dark:text-violet-400"
        (click)="fermerSidebarMobile()"
        class="flex min-w-0 items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-slate-600 transition
               hover:bg-slate-100 dark:text-slate-300
               dark:hover:bg-slate-800">
        <span class="shrink-0 text-lg">📊</span>
        <span>Statistiques</span>
      </a>
    </nav>

    <!-- BAS SIDEBAR -->
    <div class="shrink-0 border-t border-slate-200 p-4
                dark:border-slate-800">

      <button
        type="button"
        class="flex w-full items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-slate-600 transition
               hover:bg-slate-100 dark:text-slate-300
               dark:hover:bg-slate-800">
        <span class="text-lg">⚙️</span>
        <span>Paramètres</span>
      </button>

      <button
        type="button"
        (click)="deconnexion()"
        class="mt-1 flex w-full items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-red-600 transition
               hover:bg-red-50 dark:text-red-400
               dark:hover:bg-red-500/10">
        <span class="text-lg">🚪</span>
        <span>Déconnexion</span>
      </button>
    </div>
  </aside>

  <!-- CONTENU PRINCIPAL -->
  <div class="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden">

    <!-- HEADER -->
    <header
      class="sticky top-0 z-30 flex h-16 shrink-0 items-center
             justify-between gap-3 border-b border-slate-200
             bg-white/90 px-3 backdrop-blur-md sm:h-20 sm:px-6
             dark:border-slate-800 dark:bg-slate-900/90">

      <!-- GAUCHE -->
      <div class="flex min-w-0 items-center gap-3 sm:gap-4">

        <button
          type="button"
          (click)="toggleSidebar()"
          class="flex h-10 w-10 shrink-0 items-center justify-center
                 rounded-xl text-xl text-slate-600 transition
                 hover:bg-slate-100 dark:text-slate-300
                 dark:hover:bg-slate-800"
          aria-label="Ouvrir ou fermer le menu"
          [attr.aria-expanded]="sidebarOuverte">
          ☰
        </button>

        <div class="min-w-0">
          <p class="hidden text-xs text-slate-500 sm:block dark:text-slate-400">
            Espace administrateur
          </p>
          <h2 class="truncate text-sm font-semibold sm:text-base">
            Administration
          </h2>
        </div>
      </div>

      <!-- DROITE -->
      <div class="flex shrink-0 items-center gap-2 sm:gap-3">

        <!-- THÈME -->
        <button
          type="button"
          (click)="changerTheme()"
          [attr.aria-label]="estSombre() ? 'Mode clair' : 'Mode sombre'"
          class="flex h-10 w-10 items-center justify-center rounded-full
                 border border-slate-200 bg-white text-lg shadow-sm
                 transition hover:scale-105 sm:h-11 sm:w-11
                 dark:border-slate-700 dark:bg-slate-800">
          @if (estSombre()) {
            ☀️
          } @else {
            🌙
          }
        </button>

        <!-- NOTIFICATION -->
        <button
          type="button"
          aria-label="Notifications"
          class="hidden h-11 w-11 items-center justify-center
                 rounded-full border border-slate-200 bg-white
                 text-lg shadow-sm sm:flex
                 dark:border-slate-700 dark:bg-slate-800">
          🔔
        </button>

        <!-- PROFIL -->
        <div class="flex items-center gap-2 rounded-full border
                    border-slate-200 bg-white py-1 pl-1 pr-2
                    sm:gap-3 sm:pr-4
                    dark:border-slate-700 dark:bg-slate-800">

          <div class="flex h-9 w-9 shrink-0 items-center
                      justify-center rounded-full bg-violet-600
                      font-semibold text-white">
            A
          </div>

          <div class="hidden sm:block">
            <p class="text-sm font-semibold">Administrateur</p>
            <p class="text-xs text-slate-500 dark:text-slate-400">
              ADMIN
            </p>
          </div>
        </div>
      </div>
    </header>

    <!-- PAGE -->
    <main
      class="min-h-0 min-w-0 flex-1 overflow-x-hidden
             overflow-y-auto p-3 sm:p-5 lg:p-8">

      <router-outlet></router-outlet>

    </main>
  </div>
</div>
