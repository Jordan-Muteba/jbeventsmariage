<div
  class="min-h-dvh w-full overflow-x-hidden bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-white"
  [class.sidebar-open]="sidebarOuverte"
>
  <!-- FOND SOMBRE SUR MOBILE -->
  @if (sidebarOuverte) {
    <button
      type="button"
      aria-label="Fermer le menu"
      (click)="fermerSidebar()"
      class="fixed inset-0 z-40 bg-slate-950/50 backdrop-blur-sm lg:hidden"
    ></button>
  }

  <!-- SIDEBAR -->
  <aside
    class="fixed inset-y-0 left-0 z-50 flex h-dvh w-72 max-w-[85vw] flex-col
           border-r border-slate-200 bg-white shadow-xl
           transition-transform duration-300 ease-in-out
           dark:border-white/10 dark:bg-slate-900"
    [class.-translate-x-full]="!sidebarOuverte"
  >
    <!-- LOGO -->
    <div
      class="flex h-20 shrink-0 items-center justify-between gap-3
             border-b border-slate-200 px-5 dark:border-white/10"
    >
      <div class="flex min-w-0 items-center gap-3">
        <div
          class="flex h-11 w-11 shrink-0 items-center justify-center
                 rounded-2xl bg-violet-600 text-2xl text-white
                 shadow-lg shadow-violet-500/30"
        >
          💍
        </div>

        <div class="min-w-0">
          <h1 class="truncate font-bold text-slate-900 dark:text-white">
            Wedding Manager
          </h1>

          <p class="text-xs text-slate-500 dark:text-slate-400">
            Mon mariage
          </p>
        </div>
      </div>

      <!-- FERMER LE MENU SUR MOBILE -->
      <button
        type="button"
        (click)="fermerSidebar()"
        aria-label="Fermer le menu"
        class="flex h-9 w-9 shrink-0 items-center justify-center
               rounded-xl text-xl text-slate-500 hover:bg-slate-100
               dark:text-slate-300 dark:hover:bg-white/10 lg:hidden"
      >
        ✕
      </button>
    </div>

    <!-- MENU -->
    <nav class="min-h-0 flex-1 space-y-2 overflow-y-auto px-4 py-6">
      <p
        class="mb-4 px-3 text-xs font-semibold uppercase tracking-wider
               text-slate-400"
      >
        💍 Mon mariage
      </p>

      <a
        routerLink="/marie/dashboard"
        routerLinkActive="bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="fermerSidebarMobile()"
        class="flex min-w-0 items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-slate-600 transition
               hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/5"
      >
        <span class="text-lg">🏠</span>
        <span>Dashboard</span>
      </a>

      <a
        routerLink="/marie/mariage"
        routerLinkActive="bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300"
        (click)="fermerSidebarMobile()"
        class="flex min-w-0 items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-slate-600 transition
               hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/5"
      >
        <span class="text-lg">💒</span>
        <span>Mon mariage</span>
      </a>

      <a
        routerLink="/marie/invites"
        routerLinkActive="bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300"
        (click)="fermerSidebarMobile()"
        class="flex min-w-0 items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-slate-600 transition
               hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/5"
      >
        <span class="text-lg">👥</span>
        <span>Invités</span>
      </a>

      <a
        routerLink="/marie/boissons"
        routerLinkActive="bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300"
        (click)="fermerSidebarMobile()"
        class="flex min-w-0 items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-slate-600 transition
               hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/5"
      >
        <span class="text-lg">🥂</span>
        <span>Boissons</span>
      </a>

      <a
        routerLink="/marie/tables"
        routerLinkActive="bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300"
        (click)="fermerSidebarMobile()"
        class="flex min-w-0 items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-slate-600 transition
               hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/5"
      >
        <span class="text-lg">🪑</span>
        <span>Tables</span>
      </a>

      <a
        routerLink="/marie/controle"
        routerLinkActive="bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300"
        (click)="fermerSidebarMobile()"
        class="flex min-w-0 items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-slate-600 transition
               hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/5"
      >
        <span class="text-lg">🎫</span>
        <span>Contrôle</span>
      </a>

      <a
        routerLink="/marie/statistiques"
        routerLinkActive="bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300"
        (click)="fermerSidebarMobile()"
        class="flex min-w-0 items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-slate-600 transition
               hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/5"
      >
        <span class="text-lg">📊</span>
        <span>Statistiques</span>
      </a>
    </nav>

    <!-- BAS SIDEBAR -->
    <div
      class="shrink-0 space-y-2 border-t border-slate-200 p-4
             dark:border-white/10"
    >
      <button
        type="button"
        class="flex w-full items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-slate-600 transition
               hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/5"
      >
        <span class="text-lg">⚙️</span>
        <span>Paramètres</span>
      </button>

      <button
        type="button"
        (click)="deconnexion()"
        class="flex w-full items-center gap-3 rounded-xl px-4 py-3
               text-sm font-medium text-red-600 transition
               hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-500/10"
      >
        <span class="text-lg">🚪</span>
        <span>Déconnexion</span>
      </button>
    </div>
  </aside>

  <!-- CONTENU PRINCIPAL -->
  <div
    class="min-h-dvh min-w-0 transition-[margin] duration-300"
    [ngClass]="sidebarOuverte ? 'lg:ml-72' : 'lg:ml-0'"
  >
    <!-- HEADER -->
    <header
      class="sticky top-0 z-30 flex h-16 min-w-0 items-center
             justify-between gap-2 border-b border-slate-200
             bg-white/90 px-3 backdrop-blur-xl sm:h-20 sm:px-6
             dark:border-white/10 dark:bg-slate-900/90"
    >
      <div class="flex min-w-0 items-center gap-2 sm:gap-4">
        <!-- BOUTON MENU -->
        <button
          type="button"
          (click)="toggleSidebar()"
          [attr.aria-expanded]="sidebarOuverte"
          aria-label="Ouvrir ou fermer le menu"
          class="flex h-10 w-10 shrink-0 items-center justify-center
                 rounded-xl border border-slate-200 bg-white text-xl
                 transition hover:bg-slate-100
                 dark:border-white/10 dark:bg-slate-800 dark:hover:bg-white/10"
        >
          ☰
        </button>

        <div class="min-w-0">
          <p class="hidden text-xs text-slate-500 dark:text-slate-400 sm:block">
            Espace marié
          </p>

          <h2 class="truncate text-sm font-semibold text-slate-900 sm:text-base dark:text-white">
            Mon mariage
          </h2>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="flex shrink-0 items-center gap-2">
        <button
          type="button"
          (click)="changerTheme()"
          [attr.aria-label]="estSombre() ? 'Activer le mode clair' : 'Activer le mode sombre'"
          class="flex h-10 w-10 items-center justify-center rounded-xl
                 border border-slate-200 bg-white text-lg shadow-sm
                 transition hover:scale-105
                 dark:border-white/10 dark:bg-slate-800"
        >
          @if (estSombre()) {
            ☀️
          } @else {
            🌙
          }
        </button>

        <button
          type="button"
          aria-label="Notifications"
          class="hidden h-10 w-10 items-center justify-center rounded-xl
                 border border-slate-200 bg-white text-lg
                 hover:bg-slate-100 sm:flex
                 dark:border-white/10 dark:bg-slate-800 dark:hover:bg-white/10"
        >
          🔔
        </button>

        <div
          class="ml-1 hidden items-center gap-3 border-l border-slate-200 pl-3
                 sm:flex sm:pl-4 dark:border-white/10"
        >
          <div
            class="flex h-10 w-10 items-center justify-center rounded-full
                   bg-violet-100 text-lg dark:bg-violet-500/15"
          >
            💍
          </div>

          <div class="hidden leading-tight md:block">
            <p class="text-sm font-semibold text-slate-900 dark:text-white">
              Marié
            </p>
            <p class="text-xs text-slate-500 dark:text-slate-400">
              MARIE
            </p>
          </div>
        </div>
      </div>
    </header>

    <!-- PAGE -->
    <main
      class="min-w-0 max-w-full overflow-x-hidden p-3 sm:p-5 lg:p-8"
    >
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
